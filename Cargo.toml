[package]
name = "bot"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "Bangboo"
path = "src/main.rs"

[features]
default = []
# Habilita o comando /prompt (Gemini). Compile com: cargo build --features gemini
gemini = ["dep:genai"]

[dependencies]
twilight-cache-inmemory = { version = "0.18" }
twilight-gateway = { version = "0.18" }
twilight-http = { version = "0.18" }
twilight-model = { version = "0.18" }
twilight-util = { version = "0.18", features = ["builder", "snowflake"] }
discloud-rs = { git = "https://github.com/nathancmiguel/discloud-rs.git", branch = "dev" }
dotenvy = { version = "0.15" }
genai = { version = "0.7", optional = true }
regex = { version = "1.13" }
reqwest = { version = "0.13" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
skia-safe = { version = "0.157", features = ["textlayout"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
